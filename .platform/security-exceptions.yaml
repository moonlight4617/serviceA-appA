# 脆弱性・静的解析の抑制（ADR-0008）
#
# 基準そのもの（何を停止条件とするか）は platform-cicd/config/policy.yaml が
# 正であり、アプリ側では変更できない。
#
# 2種類ある。
#
#   exceptions : 一時的な抑制。理由と有効期限が必須で、
#                期限切れはそれ自体がCIの停止条件になる。
#                「後で直す技術的負債」のための枠。
#
#   permanent  : 意図した設計判断。期限ではなく見直し周期で管理する。
#                adr（判断の根拠となる記録）が必須で、
#                根拠のないものは登録できない。
#                見直し期限を超えても停止はせず、警告が出続ける。

exceptions: []
  # 例:
  # - id: CVE-2025-12345
  #   reason: 該当機能を使用していないため影響なし
  #   expires: 2026-12-31      # 最長180日先まで
  #   approved_by: sre
  #   paths: ["build.gradle.kts"]   # 任意

permanent:
  - id: yaml.github-actions.security.secrets-inherit.secrets-inherit
    reason: |
      secrets: inherit はアプリ側の記述を宣言のみに保つための中核である（NFR-01）。
      明示列挙に変えると、新しいシークレットを追加するたびに全アプリリポジトリの
      改修が必要になり、一部だけ更新されていない状態が生まれる。
      これは本基盤がなくそうとしているチーム間のバラツキそのもの（G-01）。

      セキュリティ上の実害も限定的である。渡しているシークレットのうち
      ロールARNは識別子であり、ADR-0006でOIDCの sub を環境まで固定しているため
      値を持っていてもロールを引き受けられない（実機で確認済み）。
      バケット名・テーブル名は情報隠蔽のための扱いで、資格情報ではない。
      実際の資格情報は SLACK_WEBHOOK_URL のみだが、
      これは全ワークフローが通知のために正当に必要とする。
    adr: ADR-0001
    approved_by: sre
    last_reviewed: 2026-10-12
    review_cycle_days: 180
