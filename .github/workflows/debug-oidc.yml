# 一時的な調査用。OIDCトークンの sub / aud クレームを確認する。
# 確認後に削除する。
name: Debug OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  with-environment:
    name: environment ci あり
    runs-on: ubuntu-latest
    environment: ci
    permissions:
      contents: read
      id-token: write
    steps:
      - name: subクレームを表示
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          # ペイロードのうち sub / aud / repository のみを出す（トークン本体は出さない）
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "repository", "environment", "job_workflow_ref", "workflow_ref"):
              print(f"{k} = {c.get(k)}")
          PY

  without-environment:
    name: environment なし
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: subクレームを表示
        shell: bash
        run: |
          set -euo pipefail
          token=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          python3 - "$token" <<'PY'
          import base64, json, sys
          payload = sys.argv[1].split('.')[1]
          payload += '=' * (-len(payload) % 4)
          c = json.loads(base64.urlsafe_b64decode(payload))
          for k in ("sub", "aud", "repository"):
              print(f"{k} = {c.get(k)}")
          PY
